<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter - Free Online Converters | AllInOneTool</title>
    <meta name="description" content="Use our free, premium Temperature Converter to convert celsius, fahrenheit, and kelvin temperature scales in your browser securely.">
    <meta name="keywords" content="temperature converter, converter tools, online temperature converter">
    <meta name="tool-id" content="temperature-converter">
    
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/layout.css">

<body>
    <div id="tool-workspace">
        
            <div class="tool-workspace">
                <div class="options-grid">

                        <label for="temp-celsius">Celsius (°C)</label>
                        <input type="number" id="temp-celsius" class="input-control" value="0" step="0.1">

                        <label for="temp-kelvin">Kelvin (K)</label>
                        <input type="number" id="temp-kelvin" class="input-control" value="273.15" step="0.1">
