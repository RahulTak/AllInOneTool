<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Round Image Corners - Free Online Image Tools | AllInOneTool</title>
    <meta name="description" content="Use our free, premium Round Image Corners to round the edges of any image with custom radius values in your browser securely.">
    <meta name="keywords" content="round image corners, image tools, online round image corners">
    <meta name="tool-id" content="round-image-corners">
    
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/tool.css">
    
    <!-- Libraries -->
    
    
    <!-- Script Dependency -->
    <script src="../assets/js/app.js" type="module" defer></script>
</head>
<body>
    <div id="tool-workspace">
        
        <div class="tool-workspace">
            <div class="upload-zone" id="round-dropzone">
                <span class="upload-icon">⚪</span>
                <div class="upload-text">
                    <h4>Click or Drag & Drop Image here</h4>
                </div>
                <input type="file" class="upload-input" id="round-input" accept="image/*">
            </div>

            <div id="round-workspace" style="display:none; flex-direction:column; gap:1.5rem;">
                <div style="display:flex; justify-content:center; align-items:center;">
                    <canvas id="round-canvas" style="max-height:300px; max-width:100%; border:1px solid var(--border-color);"></canvas>
                </div>

                <div class="options-grid">
                    <div class="form-group">
                        <label for="round-radius">Corner Radius (px)</label>
                        <input type="range" id="round-radius" class="input-control" min="0" max="150" value="30" style="padding:0;">
                    </div>
                </div>

                <div class="action-row">
                    <button class="btn btn-secondary" id="round-btn-reset">Reset</button>
                    <button class="btn btn-primary" id="round-btn-download">Download Image</button>
                </div>
            </div>
        </div>
        
    </div>
</body>
</html>
