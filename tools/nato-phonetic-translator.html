<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NATO Phonetic Alphabet - Free Online Text Tools | AllInOneTool</title>
    <meta name="description" content="Use our free, premium NATO Phonetic Alphabet to translate word letters into spelling indicators (alpha, bravo, charlie) in your browser securely.">
    <meta name="keywords" content="nato phonetic alphabet, text tools, online nato phonetic alphabet">
    <meta name="tool-id" content="nato-phonetic-translator">
    
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/tool.css">
    
    <!-- Libraries -->
    
    
    <!-- Script Dependency -->
    <script src="../assets/js/app.js" type="module" defer></script>
</head>
<body>
    <div id="tool-workspace">
        
            <div class="tool-workspace">
                <div class="form-group">
                    <label for="nato-input">Input Word / Text</label>
                    <textarea id="nato-input" class="input-control" style="min-height:100px;" placeholder="Enter text here...">hello</textarea>
                </div>

                <div class="form-group" style="display:flex; align-items:center; gap:0.5rem; margin-top:0.5rem; margin-bottom:1rem;">
                    <input type="checkbox" id="nato-pronounce-nums" style="cursor:pointer;">
                    <label for="nato-pronounce-nums" style="cursor:pointer; margin:0;">Pronounce numbers (e.g. Wun, Too)</label>
                </div>

                <div class="form-group">
                    <label>NATO Speller Output</label>
                    <div style="background:var(--bg-primary); border:1px solid var(--border-color); border-radius:var(--radius-sm); padding:1rem; font-weight:700; font-size:1.1rem; min-height: 80px; white-space: pre-wrap; word-break: break-all;" id="nato-output">-</div>
                </div>

                <div class="action-row">
                    <button class="btn btn-secondary" id="nato-clear">Clear</button>
                    <button class="btn btn-secondary" id="nato-reset">Reset</button>
                    <button class="btn btn-primary" id="nato-copy">Copy Output</button>
                </div>
            </div>
            
    </div>
</body>
</html>
