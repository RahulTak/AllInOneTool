<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPS to PNG Converter - Free Online Image Tools | AllInOneTool</title>
    <meta name="description" content="Use our free, premium EPS to PNG Converter to convert postscript vector drawings into raster png formats in your browser securely.">
    <meta name="keywords" content="eps to png converter, image tools, online eps to png converter">
    <meta name="tool-id" content="eps-to-png">
    
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/components.css">

    <!-- Libraries -->

</head>
<body>
    <div id="tool-workspace">
        
        <div class="tool-workspace">
            <div class="upload-zone" id="eps-dropzone">
                <span class="upload-icon">📐</span>
                <div class="upload-text">
                    <h4>Click or Drag & Drop EPS file here</h4>

                    EPS Vector file loaded. Ready for rendering: <strong id="eps-file-name">-</strong>
                </div>

                <div class="action-row">
                    <button class="btn btn-secondary" id="eps-btn-reset">Reset</button>
