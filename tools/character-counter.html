<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Counter - Free Online Text Tools | AllInOneTool</title>
    <meta name="description" content="Use our free, premium Character Counter to calculate the total count of character indices and spacers in your browser securely.">
    <meta name="keywords" content="character counter, text tools, online character counter">
    <meta name="tool-id" content="character-counter">
    
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/tool.css">
    
    <!-- Libraries -->
    
    
    <!-- Script Dependency -->
    <script src="../assets/js/app.js" type="module" defer></script>
</head>
<body>
    <div id="tool-workspace">
        
        <div class="tool-workspace">
            <div class="form-group">
                <label for="cc-text-area">Input String</label>
                <textarea id="cc-text-area" class="input-control" placeholder="Type text here to start counting..." style="min-height: 180px;"></textarea>
            </div>

            <div class="options-grid" style="grid-template-columns: repeat(4, 1fr); text-align: center;">
                <div class="form-group">
                    <label>Characters</label>
                    <h2 style="font-size: 2rem; font-weight: 800;" id="cc-char-total">0</h2>
                </div>
                <div class="form-group">
                    <label>No Spaces</label>
                    <h2 style="font-size: 2rem; font-weight: 800;" id="cc-char-nospaces">0</h2>
                </div>
                <div class="form-group">
                    <label>Words</label>
                    <h2 style="font-size: 2rem; font-weight: 800;" id="cc-words-total">0</h2>
                </div>
                <div class="form-group">
                    <label>Reading Time</label>
                    <h2 style="font-size: 2rem; font-weight: 800;" id="cc-read-time">0m</h2>
                </div>
            </div>
        </div>
        
    </div>
</body>
</html>
