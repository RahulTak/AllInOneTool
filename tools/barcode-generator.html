<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcode Generator - Free Online Developer Tools | AllInOneTool</title>
    <meta name="description" content="Use our free, premium Barcode Generator to generate barcode canvas images (code128, ean) in your browser securely.">
    <meta name="keywords" content="barcode generator, developer tools, online barcode generator">
    <meta name="tool-id" content="barcode-generator">
    
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/tool.css">
    
    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    
    <!-- Script Dependency -->
    <script src="../assets/js/app.js" type="module" defer></script>
</head>
<body>
    <div id="tool-workspace">
        
        <div class="tool-workspace">
            <div class="options-grid">
                <div class="form-group">
                    <label for="bar-type">Format</label>
                    <select id="bar-type" class="input-control">
                        <option value="CODE128">CODE128</option>
                        <option value="CODE39">CODE39</option>
                        <option value="EAN13">EAN13</option>
                        <option value="EAN8">EAN8</option>
                        <option value="UPC">UPC</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="bar-value">Barcode Value</label>
                    <input type="text" id="bar-value" class="input-control" value="12345678">
                </div>
            </div>

            <div style="display:flex; justify-content:center; align-items:center; margin:2rem 0; min-height:100px;">
                <div style="background:#ffffff; padding:1.5rem; border-radius:var(--radius-md); border:1px solid var(--border-color); display:flex; justify-content:center; align-items:center; box-shadow:var(--card-shadow);">
                    <canvas id="bar-canvas"></canvas>
                </div>
            </div>

            <div class="action-row">
                <button class="btn btn-secondary" id="bar-reset">Reset</button>
                <button class="btn btn-primary" id="bar-download">Download PNG</button>
            </div>
        </div>
        
    </div>
</body>
</html>
