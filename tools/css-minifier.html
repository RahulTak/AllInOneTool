<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Minifier & Beautifier - Free Online Developer Tools | AllInOneTool</title>
    <meta name="description" content="Use our free, premium CSS Minifier & Beautifier to minify css stylesheets or beautify them in your browser securely.">
    <meta name="keywords" content="css minifier & beautifier, developer tools, online css minifier & beautifier">
    <meta name="tool-id" content="css-minifier">
    
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/tool.css">
    
    <!-- Libraries -->
    
    
    <!-- Script Dependency -->
    <script src="../assets/js/app.js" type="module" defer></script>
</head>
<body>
    <div id="tool-workspace">
        
            <div class="tool-workspace">
                <div class="form-group">
                    <label for="css-input">CSS Input</label>
                    <textarea id="css-input" class="input-control" placeholder="body { background: white; }" style="min-height: 150px; font-family:var(--font-mono); font-size:0.85rem;"></textarea>
                </div>

                <div class="action-row" style="margin-bottom:1.5rem;">
                    <button class="btn btn-primary" id="css-minify">Minify CSS</button>
                    <button class="btn btn-secondary" id="css-beautify">Beautify CSS</button>
                    <button class="btn btn-secondary" id="css-reset">Reset</button>
                </div>

                <div class="form-group">
                    <label for="css-output">Result CSS</label>
                    <textarea id="css-output" readonly class="input-control" style="min-height: 150px; font-family:var(--font-mono); font-size:0.85rem; background:var(--bg-primary);"></textarea>
                </div>

                <div class="action-row" id="css-action-row" style="display:none;">
                    <button class="btn btn-secondary" id="css-copy">Copy Output</button>
                    <button class="btn btn-secondary" id="css-download">Download CSS</button>
                </div>
            </div>
            
    </div>
</body>
</html>
