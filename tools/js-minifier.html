<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Minifier & Beautifier - Free Online Developer Tools | AllInOneTool</title>
    <meta name="description" content="Use our free, premium JS Minifier & Beautifier to minify javascript scripts or beautify them in your browser securely.">
    <meta name="keywords" content="js minifier & beautifier, developer tools, online js minifier & beautifier">
    <meta name="tool-id" content="js-minifier">
    
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/tool.css">
    
    <!-- Libraries -->
    
    
    <!-- Script Dependency -->
    <script src="../assets/js/app.js" type="module" defer></script>
</head>
<body>
    <div id="tool-workspace">
        
            <div class="tool-workspace">
                <div class="form-group">
                    <label for="js-input">JavaScript Input</label>
                    <textarea id="js-input" class="input-control" placeholder="function hello() { console.log('hello'); }" style="min-height: 150px; font-family:var(--font-mono); font-size:0.85rem;"></textarea>
                </div>

                <div class="action-row" style="margin-bottom:1.5rem;">
                    <button class="btn btn-primary" id="js-minify">Minify JS</button>
                    <button class="btn btn-secondary" id="js-beautify">Beautify JS</button>
                    <button class="btn btn-secondary" id="js-reset">Reset</button>
                </div>

                <div class="form-group">
                    <label for="js-output">Result JavaScript</label>
                    <textarea id="js-output" readonly class="input-control" style="min-height: 150px; font-family:var(--font-mono); font-size:0.85rem; background:var(--bg-primary);"></textarea>
                </div>

                <div class="action-row" id="js-action-row" style="display:none;">
                    <button class="btn btn-secondary" id="js-copy">Copy Output</button>
                    <button class="btn btn-secondary" id="js-download">Download JS</button>
                </div>
            </div>
            
    </div>
</body>
</html>
