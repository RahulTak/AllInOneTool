<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UUID/GUID Generator - Free Online Developer Tools | AllInOneTool</title>
    <meta name="description" content="Use our free, premium UUID/GUID Generator to generate unique rfc4122 random uuid credentials in your browser securely.">
    <meta name="keywords" content="uuid/guid generator, developer tools, online uuid/guid generator">
    <meta name="tool-id" content="uuid-generator">
    
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/tool.css">
    
    <!-- Libraries -->
    
    
    <!-- Script Dependency -->
    <script src="../assets/js/app.js" type="module" defer></script>
</head>
<body>
    <div id="tool-workspace">
        
        <div class="tool-workspace">
            <div class="options-grid">
                <div class="form-group">
                    <label for="uuid-quantity">Number of UUIDs</label>
                    <input type="number" id="uuid-quantity" class="input-control" value="5" min="1" max="1000">
                </div>
            </div>

            <div class="form-group" style="margin-top:1.5rem;">
                <label>Generated UUID v4 Keys</label>
                <textarea readonly id="uuid-output" class="input-control" style="font-family:var(--font-mono); min-height:180px; font-size:0.85rem; background:var(--bg-primary);"></textarea>
            </div>

            <div class="action-row">
                <button class="btn btn-secondary" id="uuid-btn-generate">Generate</button>
                <button class="btn btn-primary" id="uuid-btn-copy">Copy All</button>
                <button class="btn btn-secondary" id="uuid-btn-download">Download TXT</button>
            </div>
        </div>
        
    </div>
</body>
</html>
