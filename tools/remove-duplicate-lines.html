<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remove Duplicate Lines - Free Online Text Tools | AllInOneTool</title>
    <meta name="description" content="Use our free, premium Remove Duplicate Lines to remove duplicate lines from text list elements instantly in your browser securely.">
    <meta name="keywords" content="remove duplicate lines, text tools, online remove duplicate lines">
    <meta name="tool-id" content="remove-duplicate-lines">
    
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/tool.css">
    
    <!-- Libraries -->
    
    
    <!-- Script Dependency -->
    <script src="../assets/js/app.js" type="module" defer></script>
</head>
<body>
    <div id="tool-workspace">
        
        <div class="tool-workspace">
            <div class="form-group">
                <label for="dup-input-text">Original Input String</label>
                <textarea id="dup-input-text" class="input-control" placeholder="Line A\nLine B\nLine A" style="min-height: 150px;"></textarea>
            </div>

            <div class="form-group" style="display:flex; align-items:center;">
                <label style="cursor:pointer;"><input type="checkbox" id="dup-preserve-order" checked> Preserve row ordering</label>
            </div>

            <div class="form-group">
                <label for="dup-output-text">Resulting Output</label>
                <textarea id="dup-output-text" readonly class="input-control" style="min-height: 150px; background:var(--bg-primary);"></textarea>
            </div>

            <div class="action-row">
                <button class="btn btn-secondary" id="dup-reset-btn">Reset</button>
                <button class="btn btn-primary" id="dup-process-btn">Remove Duplicate Lines</button>
            </div>
        </div>
        
    </div>
</body>
</html>
