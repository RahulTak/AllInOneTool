<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixelate Image - Free Online Image Tools | AllInOneTool</title>
    <meta name="description" content="Use our free, premium Pixelate Image to apply retro mosaic block filters over loaded images in your browser securely.">
    <meta name="keywords" content="pixelate image, image tools, online pixelate image">
    <meta name="tool-id" content="pixelate-image">
    
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/tool.css">
    
    <!-- Libraries -->
    
    
    <!-- Script Dependency -->
    <script src="../assets/js/app.js" type="module" defer></script>
</head>
<body>
    <div id="tool-workspace">
        
        <div class="tool-workspace">
            <div class="upload-zone" id="px-dropzone">
                <span class="upload-icon">👾</span>
                <div class="upload-text">
                    <h4>Click or Drag & Drop Image here</h4>
                </div>
                <input type="file" class="upload-input" id="px-input" accept="image/*">
            </div>

            <div id="px-workspace" style="display:none; flex-direction:column; gap:1.5rem;">
                <div style="display:flex; justify-content:center; align-items:center;">
                    <canvas id="px-canvas" style="max-height:300px; max-width:100%; border:1px solid var(--border-color);"></canvas>
                </div>

                <div class="options-grid">
                    <div class="form-group">
                        <label for="px-size">Pixel Block Size (px)</label>
                        <input type="range" id="px-size" class="input-control" min="2" max="50" value="8" style="padding:0;">
                    </div>
                </div>

                <div class="action-row">
                    <button class="btn btn-secondary" id="px-btn-reset">Reset</button>
                    <button class="btn btn-primary" id="px-btn-download">Download Image</button>
                </div>
            </div>
        </div>
        
    </div>
</body>
</html>
