<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to Base64 - Free Online Image Tools | AllInOneTool</title>
    <meta name="description" content="Use our free, premium Image to Base64 to convert any image file into a base64 text string in your browser securely.">
    <meta name="keywords" content="image to base64, image tools, online image to base64">
    <meta name="tool-id" content="image-to-base64">
    
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/tool.css">
    
    <!-- Libraries -->
    
    
    <!-- Script Dependency -->
    <script src="../assets/js/app.js" type="module" defer></script>
</head>
<body>
    <div id="tool-workspace">
        
        <div class="tool-workspace">
            <div class="upload-zone" id="b64-dropzone">
                <span class="upload-icon">🔗</span>
                <div class="upload-text">
                    <h4>Click or Drag & Drop Image here</h4>
                </div>
                <input type="file" class="upload-input" id="b64-input" accept="image/*">
            </div>

            <div id="b64-workspace" style="display:none; flex-direction:column; gap:1.5rem;">
                <div class="form-group">
                    <label>Base64 Data String</label>
                    <textarea id="b64-output-text" readonly class="input-control" style="min-height:180px; font-family:var(--font-mono); font-size:0.8rem; background:var(--bg-primary);"></textarea>
                </div>

                <div class="action-row">
                    <button class="btn btn-secondary" id="b64-btn-reset">Reset</button>
                    <button class="btn btn-primary" id="b64-btn-copy">Copy to Clipboard</button>
                </div>
            </div>
        </div>
        
    </div>
</body>
</html>
