<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON to CSV Converter - Free Online Converters | AllInOneTool</title>
    <meta name="description" content="Use our free, premium JSON to CSV Converter to export nested json fields as csv spreadsheet files in your browser securely.">
    <meta name="keywords" content="json to csv converter, converter tools, online json to csv converter">
    <meta name="tool-id" content="json-to-csv">
    
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/tool.css">
    
    <!-- Libraries -->
    
    
    <!-- Script Dependency -->
    <script src="../assets/js/app.js" type="module" defer></script>
</head>
<body>
    <div id="tool-workspace">
        
        <div class="tool-workspace">
            <div class="form-group">
                <label for="json-val-input">JSON Array Input</label>
                <textarea id="json-val-input" class="input-control" placeholder="[ {\"name\": \"John\", \"age\": 30} ]" style="min-height: 150px; font-family:var(--font-mono); font-size:0.85rem;"></textarea>
            </div>

            <div class="form-group">
                <label for="csv-val-output">CSV Result</label>
                <textarea id="csv-val-output" readonly class="input-control" style="min-height: 150px; font-family:var(--font-mono); font-size:0.85rem; background:var(--bg-primary);"></textarea>
            </div>

            <div class="action-row">
                <button class="btn btn-primary" id="json-btn-convert">Convert JSON to CSV</button>
            </div>
        </div>
        
    </div>
</body>
</html>
