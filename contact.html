<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us – AllInOneTool Support & Feedback</title>
    <meta name="description" content="Get in touch with the AllInOneTool team. Submit inquiries, report bugs, suggest new client-side tools, or request support directly.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://allinonetool.com/contact.html">
    
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Contact Us – AllInOneTool Support & Feedback">
    <meta property="og:description" content="Get in touch with the AllInOneTool team. Submit inquiries, report bugs, suggest new client-side tools, or request support directly.">
    <meta property="og:url" content="https://allinonetool.com/contact.html">
    <meta property="og:image" content="https://allinonetool.com/assets/images/og-banner.png">
    <meta property="og:site_name" content="AllInOneTool">
    
    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Contact Us – AllInOneTool Support & Feedback">
    <meta name="twitter:description" content="Get in touch with the AllInOneTool team. Submit inquiries, report bugs, suggest new client-side tools, or request support directly.">
    <meta name="twitter:image" content="https://allinonetool.com/assets/images/og-banner.png">
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "ContactPage",
        "@id": "https://allinonetool.com/contact.html#webpage",
        "url": "https://allinonetool.com/contact.html",
        "name": "Contact Us – AllInOneTool Support & Feedback",
        "description": "Get in touch with the AllInOneTool team. Submit inquiries, report bugs, suggest new client-side tools, or request support directly.",
        "isPartOf": {
            "@type": "WebSite",
            "@id": "https://allinonetool.com/#website",
            "name": "AllInOneTool",
            "url": "https://allinonetool.com/"
        }
    }
    </script>
    
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="./assets/css/variables.css">
    <link rel="stylesheet" href="./assets/css/base.css">
    <link rel="stylesheet" href="./assets/css/layout.css">
    <link rel="stylesheet" href="./assets/css/components.css">
    
    <!-- Script Dependency -->
    <script src="./assets/js/app.js" type="module" defer></script>
</head>
<body>
    <div class="container" style="max-width: 800px; padding: 4rem 1.5rem;">
        <h1 style="font-size: 2.5rem; font-weight: 800; margin-bottom: 1.5rem;">Contact Us</h1>
        <p style="color: var(--text-secondary); margin-bottom: 2rem;">Have questions, bug reports, or ideas for new client-side tools? Drop us a line below or reach out at <strong>support@allinonetool.com</strong>.</p>
        
        <form onsubmit="event.preventDefault(); alert('Inquiry submitted successfully (simulation-only).'); this.reset();" style="display: flex; flex-direction: column; gap: 1.25rem; background-color: var(--bg-secondary); border: 1px solid var(--border-color); padding: 2.5rem; border-radius: var(--radius-md); box-shadow: var(--card-shadow);">
            <div class="form-group">
                <label for="contact-name">Your Name</label>
                <input type="text" class="input-control" id="contact-name" placeholder="John Doe" required>
            </div>
            
            <div class="form-group">
                <label for="contact-email">Email Address</label>
                <input type="email" class="input-control" id="contact-email" placeholder="john@example.com" required>
            </div>

            <div class="form-group">
                <label for="contact-msg">Message</label>
                <textarea class="input-control" id="contact-msg" placeholder="Describe your inquiry..." required style="min-height: 120px;"></textarea>
            </div>

            <button class="btn btn-primary" type="submit" style="align-self: flex-start; padding: 0.75rem 2rem;">Send Message</button>
        </form>
    </div>
</body>
</html>
